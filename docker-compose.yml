services:
  db:
    container_name: dietitian-db
    build:
      context: ./back-end
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: black
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dietitian_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api:
    container_name: dietitian-api
    build:
      context: .
      dockerfile: back-end/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://black:${DB_PASSWORD}@db:5432/dietitian_db
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
    depends_on:
      - db
      - ollama
    restart: always

  ollama:
    container_name: dietitian-ollama
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  frontend:
    container_name: dietitian-frontend
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./front-end:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
  ollama_data:
