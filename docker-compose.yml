services:
  db:
    
    build:
      context: ./back-end
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: black
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project-root .env file}
      POSTGRES_DB: dietitian_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api:
    
    build:
      context: .
      dockerfile: back-end/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://black@db:5432/dietitian_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project-root .env file}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_TIMEOUT_SECONDS: "240"
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-300}
      AI_CACHE_MAX_ENTRIES: ${AI_CACHE_MAX_ENTRIES:-128}
      # Optional: only the IP/CIDR of a reverse proxy you control.
      REGISTRATION_TRUSTED_PROXY_CIDRS: ${REGISTRATION_TRUSTED_PROXY_CIDRS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    depends_on:
      - db
      - ollama
    restart: always

  # Optional FR-1.5 email delivery. Never enable without approved SMTP credentials.
  welcome-worker:
    profiles: ["notifications"]
    build:
      context: .
      dockerfile: back-end/Dockerfile.api
    command: python welcome_worker.py
    environment:
      DATABASE_URL: postgresql://black@db:5432/dietitian_db
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local .env}
      WELCOME_SMTP_HOST: ${WELCOME_SMTP_HOST:-}
      WELCOME_SMTP_PORT: ${WELCOME_SMTP_PORT:-587}
      WELCOME_SMTP_USER: ${WELCOME_SMTP_USER:-}
      WELCOME_SMTP_PASSWORD: ${WELCOME_SMTP_PASSWORD:-}
      WELCOME_FROM_EMAIL: ${WELCOME_FROM_EMAIL:-}
    depends_on: [db]
    restart: unless-stopped

  ollama:
    
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: always
  frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./front-end:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: always
volumes:
  postgres_data:
  ollama_data:
