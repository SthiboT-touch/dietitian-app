# NutriCare local UI test: isolated containers, no PostgreSQL, no persistent volumes.
# Start ONLY with: docker compose -f docker-compose.memory.yml up --build -d
name: nutricare-memory-test
services:
  api:
    build:
      context: .
      dockerfile: back-end/Dockerfile.api
    environment:
      APP_USE_IN_MEMORY_DB: "1"
      DATABASE_URL: ""
      DB_PASSWORD: ""
      STYTCH_ENABLED: "0"
      STYTCH_PROJECT_ID: ""
      STYTCH_SECRET: ""
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_API_KEY: ""
      LANGCHAIN_API_KEY: ""
      NUTRICARE_ENABLE_API_DOCS: "1"
      # DEMO ONLY: public room links are not approved for real clinical consultations.
      NUTRICARE_MEETING_BASE_URL: "https://meet.jit.si"
      # AI Coach needs a separately configured Ollama service and model.
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      OLLAMA_MODEL: "llama3.2"
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 8
      start_period: 45s

  frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./front-end:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
