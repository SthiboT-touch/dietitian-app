# Route templates and request IDs are logged by FastAPI. Do not store raw
# URLs here: patient identifiers or query strings may be present.
log_format nutricare_safe '$time_iso8601 level=INFO method=$request_method status=$status '
                          'upstream=$upstream_status duration=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log nutricare_safe;
    server_name _;

    client_max_body_size 12m;

    # Old page bookmarks now open sections inside the combined HTML file.
    location ~ ^/(?:static/)?traditional/([a-z-]+)\.html$ {
        return 302 "/#traditional/$1$is_args$args";
    }
    location ~ ^/(?:static/)?student/index\.html$ {
        return 302 "/#student/login";
    }
    location ~ ^/(?:static/)?student/([a-z-]+)\.html$ {
        return 302 "/#student/$1";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI answers can be slow on a CPU server
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
