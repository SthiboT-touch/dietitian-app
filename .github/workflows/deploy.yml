name: Deploy to Oracle Cloud Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          envs: RESEND_API_KEY,RESEND_FROM_EMAIL
          script: |
            set -eu
            cd ~/dietitian-app_2
            if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${RESEND_FROM_EMAIL:-}" ]; then
              echo "Configure RESEND_API_KEY and RESEND_FROM_EMAIL as GitHub Actions repository secrets before deploying." >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard FETCH_HEAD
            mkdir -p data backups
            docker compose build api
            ollama_model=$(docker compose run --rm --no-deps api python -c 'import os; print(os.environ["OLLAMA_MODEL"])')
            docker compose up -d ollama
            for attempt in $(seq 1 30); do
              if docker compose exec -T ollama ollama list >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Ollama did not become ready" >&2
                exit 1
              fi
              sleep 2
            done
            docker compose exec -T ollama ollama pull "$ollama_model"
            sqlite_backup="nutricare-pre-deploy-$(date +%Y%m%d-%H%M%S).sqlite"
            if [ -f data/nutricare.sqlite ]; then
              docker compose run --rm --no-deps api python -c \
                'import sqlite3,sys; source=sqlite3.connect("file:/data/nutricare.sqlite?mode=ro",uri=True); backup=sqlite3.connect(sys.argv[1]); source.backup(backup); backup.close(); source.close()' \
                "/data/$sqlite_backup"
            fi
            if [ ! -f data/.sqlite-cutover-complete ]; then
              api_stopped=0
              welcome_worker_stopped=0
              restore_services() {
                exit_code=$?
                if [ "$exit_code" -ne 0 ] && [ "$api_stopped" -eq 1 ] && [ ! -f data/.sqlite-cutover-complete ]; then
                  echo "SQLite cutover failed before the copy completed; restarting the previous API and worker." >&2
                  if ! docker compose start api; then
                    echo "Could not restart the previous API container." >&2
                  fi
                  if [ "$welcome_worker_stopped" -eq 1 ] && ! docker compose --profile notifications start welcome-worker; then
                    echo "Could not restart the previous welcome worker." >&2
                  fi
                fi
                return "$exit_code"
              }
              trap restore_services EXIT
              docker compose --profile postgres-source up -d db
              for attempt in $(seq 1 30); do
                if docker compose exec -T db pg_isready -U black -d dietitian_db; then
                  break
                fi
                if [ "$attempt" -eq 30 ]; then
                  echo "PostgreSQL source did not become ready" >&2
                  exit 1
                fi
                sleep 2
              done
              pg_clients=$(docker compose exec -T db psql -U black -d dietitian_db -tAc "select count(*) from client")
              if [ "${pg_clients:-0}" -lt 1 ]; then
                echo "PostgreSQL source has no clients; refusing to cut over" >&2
                exit 1
              fi
              docker compose stop api
              api_stopped=1
              if [ -n "$(docker compose --profile notifications ps -q welcome-worker)" ]; then
                docker compose --profile notifications stop welcome-worker
                welcome_worker_stopped=1
              fi
              docker compose exec -T db pg_dump -U black -d dietitian_db -Fc > "backups/pre-sqlite-cutover-$(date +%Y%m%d-%H%M%S).dump"
              docker compose run --rm --no-deps \
                -e DATABASE_URL=postgresql://black@db:5432/dietitian_db \
                api python migrations/migrate_postgres_to_sqlite.py --sqlite-path /data/nutricare.sqlite
              docker compose run --rm --no-deps api touch /data/.sqlite-cutover-complete
              docker compose stop db
            elif [ ! -s data/nutricare.sqlite ]; then
              echo "SQLite cutover marker exists but data/nutricare.sqlite is missing or empty" >&2
              exit 1
            fi
            docker compose up -d --build
            for attempt in $(seq 1 30); do
              if docker compose exec -T api python -c 'import urllib.request,json; h=json.load(urllib.request.urlopen("http://localhost:8000/health")); assert h["database"] == "online"'; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "API health check did not pass" >&2
                exit 1
              fi
              sleep 3
            done
            for attempt in $(seq 1 30); do
              if curl --fail --silent --max-time 5 http://127.0.0.1:3000/health >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Frontend/API health check on port 3000 did not pass" >&2
                docker compose ps
                docker compose logs --tail=100 frontend api
                exit 1
              fi
              sleep 3
            done
      - name: Verify public application endpoint
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent --max-time 10 "https://health4lyf.co.za/health" >/dev/null; then
              echo "Public health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Public health check failed; verify server ingress/firewall and deployment logs" >&2
          exit 1
