name: Deploy to Oracle Cloud Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for setting in SERVER_HOST SERVER_USER SSH_PRIVATE_KEY; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing repository secret: $setting"
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo '::error::SSH_PRIVATE_KEY must contain a valid, unencrypted private key.'
            exit 1
          fi
          if ! ssh-keyscan -T 15 -H "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null; then
            echo '::error::Cannot reach the deployment server on SSH port 22. Check SERVER_HOST and the server firewall.'
            exit 1
          fi
          if ! ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" true; then
            echo '::error::SSH login failed. Check SERVER_USER and whether the matching public key is authorized on the server.'
            exit 1
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "$SERVER_USER@$SERVER_HOST" 'bash -se' < scripts/deploy.sh
